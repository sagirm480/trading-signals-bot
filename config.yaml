# הפעלה/כיבוי אותות לפי כיוון. כובה sell לפי בקטסט מ-2026-08-08: 162 עסקאות
# מכירה, שיעור הצלחה 30.2%, R ממוצע -0.14 (נטו שלילי) - לעומת קנייה שהייתה
# חיובית. סביר שזה נובע מכך שתקופת הבדיקה (3 שנים אחרונות) הייתה שוק עולה
# ברוב המניות ברשימה, לא בהכרח פגם קבוע במערכת. אפשר להדליק מחדש בעתיד אחרי
# בדיקה נוספת (תקופה/מניות אחרות) - ראה backtest_results.json.
signals_enabled:
  buy: true
  sell: false

# סף % (מתוך המשקל המקסימלי האפשרי) להפעלת אות
# הערה: 60% היה בלתי אפשרי בפועל - נבדק אמפירית על 10 מניות/1700 דגימות
# היסטוריות והציון בפועל כמעט אף פעם לא עובר 30% (כי 26 הפרמטרים ברובם
# בלעדיים זה לזה ולא יכולים להיות פעילים בו-זמנית). הסף כאן כוייל לפרסנטיל
# 95 בערך של הציון האמיתי - ראה backtest_results.json.
thresholds:
  buy: 20
  sell: 20
  htf: 60   # סף למסגרות זמן גבוהות (4H / שבועי) - סקאלה שונה, 4 פרמטרים בלבד, 60 כן מציאותי כאן

# פרופיל נפח מעוגן (Volume Profile)
volume_profile:
  lookback_days: 100
  bins: 24
  value_area_pct: 70

proximity_pct: 1.5   # טווח קרבה לתמיכה/התנגדות (%) לצורך תבניות נרות מבוססות S/R
pivot_lookback: 25   # bars לזיהוי פיבוט (תמיכה/התנגדות + תבניות גרפיות)
max_pivots: 10        # כמה פיבוטים אחרונים לזכור לצורך תבניות גרפיות

# ============================================================
# משקלים - זהים בברירת המחדל למשקלים באינדיקטור ב-TradingView
# (full_indicator_6.pine), כדי ששתי המערכות ייתנו תוצאה דומה.
# ניתן לשנות כאן בלי לגעת בקוד.
# ============================================================
# המשקלים הטכניים תוקנו ב-2026-08-08 לפי אבחון בקטסט על 109 עסקאות אמיתיות/
# 3 שנים (ראה analyze_diagnostics.py + backtest_diag_3y.json):
#  - volume_buy הורד חזק: נפח גבוה בכניסה בפועל *הזיק* (avg_r -0.06 מול +0.40
#    בלעדיו) - כנראה נפח שיא = מיצוי/FOMO, לא צבירה מוקדמת.
#  - ma150_cross_buy הורד: כמעט ולא ניבא הצלחה (0.125 מול 0.154 בלעדיו).
#  - pivot_sr_buy הורד: כניסה "קרוב לתמיכה" (פיבוט בסיסי) דווקא ביצעה גרוע
#    יותר (0.047 מול 0.182 בלעדיו) - כנראה תמיכה רועשת/שבורה, לא אמיתית.
#  - vp_strong_buy הועלה: קרבה ל-Volume Profile (POC/VAH/VAL) כן ניבאה טוב
#    יותר (0.200 מול 0.068 בלעדיו).
#  - נוסף healthy_pullback: תבנית היפוך + מחיר 1-3 ATR מעל MA50 (לא צמוד,
#    לא מתוח מדי) - הקומבינציה הכי חזקה שנמצאה (57% הצלחה, avg_r +0.71).
# חשוב: זה כיול על סמך אותו דאטה שנבדק בו (in-sample) - לא הוכחה חיצונית,
# רק השערה מבוססת-נתונים. דורש מעקב live להוכחה אמיתית.
weights:
  technical:
    trend_ma50_buy: 10
    trend_ma50_sell: 10
    ma150_cross_buy: 4
    ma150_cross_sell: 12
    rsi_bounce: 8
    rsi_reject: 8
    volume_buy: 2
    volume_sell: 8
    pivot_sr_buy: 4
    pivot_sr_sell: 10
    vp_strong_buy: 20

# כל כמה שניות לבדוק את כל רשימת המעקב (בזמן שעות המסחר)
loop_interval_seconds: 900   # 15 דקות

# שעות מסחר (שוק ארה"ב, שעון ניו יורק) - מחוץ לשעות אלה הלולאה "ישנה" יותר זמן
market_timezone: "America/New_York"
market_open: "09:30"
market_close: "16:00"
idle_sleep_seconds: 1800     # שינה כשהשוק סגור (30 דקות בין בדיקות)

# ============================================================
# ניהול תיק/סיכונים - נקבע ביחד עם המשתמש ב-2026-08-08
# ============================================================
portfolio:
  account_size_usd: 1000        # גודל התיק המוקדש למערכת
  risk_per_trade_pct: 2.0       # % מהתיק לסכן בכל עסקה בודדת (= $20 בגודל תיק נוכחי)
  max_concurrent_positions: 3   # כמה פוזיציות פתוחות בו-זמנית מקסימום
  max_positions_per_sector: 1   # מגבלת קורלציה - כמה פוזיציות פתוחות מאותו סקטור/נושא בו-זמנית
  fractional_shares: true       # מניח ברוקר עם מניות שבריות (התיק קטן, ברוב המניות סכום הסיכון < מחיר מניה אחת)

# מיפוי סקטור/נושא לכל טיקר - לצורך מגבלת קורלציה (max_positions_per_sector).
# מיפוי גס/ידני, לא רשמי - מטרתו למנוע 3 פוזיציות בו-זמנית בשמות מתואמים
# (למשל 3 מניות שבבים) יותר מאשר דיוק סיווג מושלם.
